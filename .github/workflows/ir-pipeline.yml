name: IR Pipeline

on:
  workflow_dispatch:
    inputs:
      max_docs:
        description: "Maximum number of documents to process"
        required: false
        default: "200000"
      query:
        description: "Query used to probe the index"
        required: false
        default: "cloud storage backup"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download NLTK resources
        run: python -m nltk.downloader stopwords punkt wordnet omw-1.4

      - name: Preprocess documents
        run: python scripts/process_docs.py --dataset msmarco-passage/train --max-docs ${{ github.event.inputs.max_docs || '200000' }}

      - name: Build and probe index
        run: python scripts/test_index.py --input-dir data/processed --query "${{ github.event.inputs.query || 'cloud storage backup' }}"
